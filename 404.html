<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Playlist Sync</title>
    <script type="text/javascript">
        // Takes the current URL path, turns it into a query string, and redirects to index.html
        var pathSegmentsToKeep = 0; // Set to 1 if using user.github.io/repo-name, or 0 if custom domain/user.github.io
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body>
</body>

</html>
